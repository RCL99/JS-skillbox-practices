<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор доставки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Калькулятор стоимости доставки</h1>

    <form id="product-form" novalidate>
        <div class="field">
            <label for="name">Название товара:</label>
            <input type="text" id="name" name="name">
        </div>

        <div class="field">
            <label for="weight">Вес (кг):</label>
            <input type="number" id="weight" name="weight" min="0" step="any">
        </div>

        <div class="field">
            <label for="distance">Расстояние (км):</label>
            <input type="number" id="distance" name="distance" min="0" step="any">
        </div>

        <span id="form-error" class="error"></span>

        <button type="submit">Добавить товар</button>
    </form>

    <table class="product-table">
        <thead>
            <tr>
                <th>Название товара</th>
                <th>Вес (кг)</th>
                <th>Расстояние (км)</th>
                <th>Стоимость доставки</th>
            </tr>
        </thead>
        <tbody id="product-body"></tbody>
    </table>

    <script src="index.js"></script>
</body>
</html>
