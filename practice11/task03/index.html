<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Банковская карта</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Оформление банковской карта</h1>

    <div class="field">
        <label for="card-text">Текст на карте:</label>
        <input type="text" class="card-text" placeholder="Введите текст">
    </div>

    <div class="field">
        <label for="card-color">Цвет карты:</label>
        <select class="card-color">
            <option value="red">Красный</option>
            <option value="blue">Синий</option>
            <option value="green">Зеленый</option>
        </select>
    </div>

    <p class="card">Ваша банковская карта</p>

    <script src="index.js"></script>
</body>
</html>
